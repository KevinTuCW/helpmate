[project]
name = "helpmate"
version = "0.1.0"
description = "Enterprise KB support copilot: RAG + function-calling (orders/logistics)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "langgraph>=0.0.40",
  "openai>=1.30",
  "python-multipart>=0.0.9",
  "httpx[socks]>=0.27",
  "beautifulsoup4>=4.12",
  "pymupdf>=1.24",
  "langfuse>=4.14",
  "ragas>=0.2",            # eval generation-quality metrics (eval_generate=True path)
  "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
